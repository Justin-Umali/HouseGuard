{% extends "base.html" %}
{% block title %}Sign in - HomeGuard{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>&#128737; HomeGuard</h1>
  <p class="muted">Sign in to view your cameras and alerts.</p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Password
      <input type="password" name="password" autocomplete="current-password" autofocus required>
    </label>
    <button class="btn" type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
