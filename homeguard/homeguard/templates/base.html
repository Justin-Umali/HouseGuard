<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}HomeGuard{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  {% if session.get('auth') %}
  <header class="topbar">
    <a class="brand" href="{{ url_for('dashboard') }}">&#128737; HomeGuard</a>
    <nav>
      <a href="{{ url_for('dashboard') }}">Live</a>
      <a href="{{ url_for('events') }}">Events</a>
      <a href="{{ url_for('settings_page') }}">Settings</a>
      <form method="post" action="{{ url_for('logout') }}" class="inline">
        <input type="hidden" name="csrf" value="{{ csrf_token() }}">
        <button class="link" type="submit">Log out</button>
      </form>
    </nav>
  </header>
  {% endif %}
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
